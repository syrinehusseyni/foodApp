name: Food Delivery Microservices CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# =========================
# GHCR PERMISSIONS (REQUIRED)
# =========================
permissions:
  contents: read
  packages: write

jobs:

  # =========================
  # USER SERVICE
  # =========================
  user-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build User Service
        working-directory: backend/user-service
        run: mvn clean install

      - name: Build Docker image
        working-directory: backend/user-service
        run: docker build -t ghcr.io/syrinehusseyni/user-service:latest .

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Docker image
        run: docker push ghcr.io/syrinehusseyni/user-service:latest


  # =========================
  # ORDER SERVICE
  # =========================
  order-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Order Service
        working-directory: backend/order-service
        run: mvn clean install

      - name: Build Docker image
        working-directory: backend/order-service
        run: docker build -t ghcr.io/syrinehusseyni/order-service:latest .

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Docker image
        run: docker push ghcr.io/syrinehusseyni/order-service:latest


  # =========================
  # RESTAURANT SERVICE
  # =========================
  restaurant-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Restaurant Service
        working-directory: backend/restaurant-service
        run: mvn clean install

      - name: Build Docker image
        working-directory: backend/restaurant-service
        run: docker build -t ghcr.io/syrinehusseyni/restaurant-service:latest .

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Docker image
        run: docker push ghcr.io/syrinehusseyni/restaurant-service:latest


  # =========================
  # ADMIN SERVICE
  # =========================
  admin-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Admin Service
        working-directory: backend/admin-service
        run: mvn clean install

      - name: Build Docker image
        working-directory: backend/admin-service
        run: docker build -t ghcr.io/syrinehusseyni/admin-service:latest .

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Docker image
        run: docker push ghcr.io/syrinehusseyni/admin-service:latest


  # =========================
  # DELIVERY SERVICE
  # =========================
  delivery-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Delivery Service
        working-directory: backend/delivery-service
        run: mvn clean install

      - name: Build Docker image
        working-directory: backend/delivery-service
        run: docker build -t ghcr.io/syrinehusseyni/delivery-service:latest .

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Docker image
        run: docker push ghcr.io/syrinehusseyni/delivery-service:latest


  # =========================
  # API GATEWAY
  # =========================
  api-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build API Gateway
        working-directory: backend/api-gateway
        run: mvn clean install

      - name: Build Docker image
        working-directory: backend/api-gateway
        run: docker build -t ghcr.io/syrinehusseyni/api-gateway:latest .

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Docker image
        run: docker push ghcr.io/syrinehusseyni/api-gateway:latest


  # =========================
  # EUREKA SERVER
  # =========================
  eureka-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Eureka Server
        working-directory: backend/eureka-server
        run: mvn clean install

      - name: Build Docker image
        working-directory: backend/eureka-server
        run: docker build -t ghcr.io/syrinehusseyni/eureka-server:latest .

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Docker image
        run: docker push ghcr.io/syrinehusseyni/eureka-server:latest


  # =========================
  # FRONTEND
  # =========================
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Docker image
        working-directory: frontend
        run: docker build -t ghcr.io/syrinehusseyni/frontend:latest .

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Docker image
        run: docker push ghcr.io/syrinehusseyni/frontend:latest